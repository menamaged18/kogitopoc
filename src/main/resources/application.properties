spring.application.name=kogitopoc

# MS SQL Connection Properties
spring.datasource.url=jdbc:sqlserver://localhost;databaseName=jbpmpoc;encrypt=false;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=YourStrongPassword123!
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.datasource.type=com.zaxxer.hikari.HikariDataSource

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

kogito.persistence.type=jdbc
kogito.persistence.auto.ddl=true
kogito.persistence.datasource=default

# spring.devtools.restart.exclude=com/kogitopoc/kogitopoc/Events/**,org/kie/kogito/**

# Disable Kogito REST Code Generation
# This tells the kogito-maven-plugin during compilation to skip generating JAX-RS / Spring REST controller classes.
kogito.codegen.rest=false
kogito.codegen.process.rest=false