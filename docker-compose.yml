services:
  sqlserver:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kogito-sqlserver
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrongPassword123!"
    volumes:
      - kogito-sqlserver-data:/var/opt/mssql

volumes:
  kogito-sqlserver-data: